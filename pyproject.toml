[project]
name = "yf_rag"
version = "1.0.0"
description = "翊丰RAG - 基于深度文档理解的RAG引擎"
requires-python = ">=3.10,<3.12"
authors = [
    { name = "Yi Feng", email = "yifeng@gmail.com" }
]
license = { text = "MIT" }
readme = "README.md"
dependencies = [
    # Django生态
    "Django>=5.2,<6.0",
    "djangorestframework>=3.15.0",
    "drf-spectacular>=0.27.0",
    "django-cors-headers>=4.3.0",
    "django-comment-migrate>=0.1.7",
    # 异步任务
    "celery>=5.3.0",
    "redis>=5.0.0",
    "django-redis>=5.4.0",
    "django-filter>=24.0",
    "django-celery-results>=2.5.0",
    "django-celery-beat>=2.5.0",
    "eventlet>=0.41.0",
    # 数据库
    "PyMySQL>=1.1.0",
    # 向量检索
    "elasticsearch>=8.12.0",
    "elasticsearch-dsl>=8.12.0",
    "qdrant-client>=1.7.0",
    # 对象存储
    "boto3>=1.34.0",
    "minio>=7.2.0",
    # LLM集成
    "openai>=1.45.0",
    # 文档处理
    "pypdf>=5.0.0",
    "pdfplumber>=0.10.0",
    "PyMuPDF>=1.26.0",
    "python-docx>=1.1.0",
    "openpyxl>=3.1.0",
    # 向量模型
    "transformers>=4.36.0",
    "torch>=2.6.0",
    "sentence-transformers>=2.2.0",
    # 图数据库
    "neo4j>=5.28.0",
    # 中文处理
    "marisa-trie>=1.4.1",
    "hanziconv>=0.3.2",
    "nltk>=3.9.0",
    # 工具库
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "tiktoken>=0.7.0",
    "loguru>=0.7.0",
    "xxhash>=3.4.0",
    "python-dotenv>=1.0.0",
    # 项目部署
    "gunicorn==23.0.0",
    # 多模态
    "byaldi>=0.0.7",
    "pdf2image>=1.17.0",
    "qwen-vl-utils>=0.0.8",
    "docx2pdf>=0.1.8",
    "Pillow>=10.0.0",
    "einops>=0.8.0",
    "accelerate>=0.33.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-django>=4.7.0",
    "pytest-cov>=4.1.0",
    "black>=24.0.0",
    "ruff>=0.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple/"
default = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }

[tool.setuptools.packages.find]
where = ["."]
include = ["rag*"]

[tool.uv]
package = false

[tool.setuptools]
py-modules = []

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "__000__django.settings"
python_files = ["test_*.py", "*_test.py"]
testpaths = ["tests"]
